# Entorno de desarrollo. Producción: infra/docker-compose.prod.yml (Fase 7).
name: bottrade

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bottrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: bottrade
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde la máquina local, nunca desde fuera.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottrade -d bottrade"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
