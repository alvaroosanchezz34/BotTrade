<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BotTrade — sin conexión</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; margin: 0; display: grid; place-items: center; min-height: 100dvh; padding: 24px; text-align: center; }
      button { min-height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: #38bdf8; color: #04121f; font-weight: 700; font-size: 1rem; }
      p { color: #a3b3cb; max-width: 28rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay conexión con el servidor. El bot sigue funcionando en el servidor aunque no puedas verlo ahora; esta pantalla no muestra datos para no enseñar información desactualizada como si fuese actual.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
