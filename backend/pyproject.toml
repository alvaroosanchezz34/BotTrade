[project]
name = "bottrade"
version = "0.1.0"
description = "Plataforma de trading algorítmico en simulación/testnet"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143,<0.200",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<0.40",
    "httpx>=0.28,<0.30",
    "websockets>=17,<18",
    "pandas>=3.0,<4",
    "numpy>=2.5,<3",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[project.scripts]
bottrade = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "network: tests que acceden a Internet (desactivados por defecto, usar -m network)",
]
addopts = "-m 'not network' -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "ASYNC"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pandas.*", "argon2.*"]
ignore_missing_imports = true
